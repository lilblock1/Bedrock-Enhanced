name: Build Bedrock Enhanced Native Launcher

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bedrock-enhanced-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout Bedrock Enhanced source and branding
        uses: actions/checkout@v4

      - name: Checkout licensed LeviLaunchroid foundation (pinned revision)
        uses: actions/checkout@v4
        with:
          repository: LiteLDev/LeviLaunchroid
          ref: cc5c7bc6eac48f1e82adf705b8b5f63ba0883247
          path: upstream
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 36 / CMake
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '2.9.9'
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: 'bedrock-enhanced-launcher'

      - name: Setup NDK r28c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Apply Bedrock Enhanced changes with full attribution
        run: |
          python3 -m py_compile launcher/patch_upstream.py
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export BE_VERSION="${GITHUB_REF_NAME#v}"
          fi
          python3 launcher/patch_upstream.py upstream
          grep -q 'applicationId "com.bedrockenhanced.launcher"' upstream/app/build.gradle
          grep -q 'BedrockEnhancedHomeActivity' upstream/app/src/main/AndroidManifest.xml
          test -s upstream/app/src/main/assets/LEVI_LAUNCHROID_APACHE_2_LICENSE.txt
          test -s upstream/app/src/main/assets/BEDROCK_ENHANCED_THIRD_PARTY_NOTICES.txt

      - name: Create CI-only Firebase placeholder
        run: |
          cat > upstream/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "be-ci-placeholder",
              "storage_bucket": "be-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.bedrockenhanced.launcher"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "AIzaSyCIOnlyPlaceholderKey"}],
                "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              }
            ],
            "configuration_version": "1"
          }
          JSON
          python3 -m json.tool upstream/app/google-services.json >/dev/null
          echo 'curseforge.api_key=' > upstream/local.properties

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Compile launcher APK
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --max-workers=2

      - name: Verify APK identity and native runtime libraries
        if: success()
        run: |
          set -euo pipefail
          APK="$(find upstream/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F 'com.bedrockenhanced.launcher'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libpreloader.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libgxcore.so'
          unzip -l "$APK" | grep -F 'assets/LEVI_LAUNCHROID_APACHE_2_LICENSE.txt'

      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BedrockEnhanced-Launcher-debug-apk
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Stable release signing is required for Android in-place updates.
      # All four signing secrets are required; never commit keystores.
      - name: Sign stable GitHub release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BEDROCK_KEYSTORE_B64: ${{ secrets.BEDROCK_SIGNING_KEYSTORE_BASE64 }}
          BEDROCK_STORE_PASSWORD: ${{ secrets.BEDROCK_SIGNING_STORE_PASSWORD }}
          BEDROCK_KEY_ALIAS: ${{ secrets.BEDROCK_SIGNING_KEY_ALIAS }}
          BEDROCK_KEY_PASSWORD: ${{ secrets.BEDROCK_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${BEDROCK_KEYSTORE_B64:-}" || -z "${BEDROCK_STORE_PASSWORD:-}" || -z "${BEDROCK_KEY_ALIAS:-}" || -z "${BEDROCK_KEY_PASSWORD:-}" ]]; then
            echo "::error::Release signing secrets missing. Publishing blocked."
            exit 1
          fi
          printf "%s" "$BEDROCK_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bedrock-release.jks"
          chmod 600 "$RUNNER_TEMP/bedrock-release.jks"
          INPUT_APK="$(find upstream/app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" | head -n 1)"
          ASSET="BedrockEnhanced-Launcher-${GITHUB_REF_NAME}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/bedrock-release.jks" \
            --ks-key-alias "$BEDROCK_KEY_ALIAS" \
            --ks-pass env:BEDROCK_STORE_PASSWORD \
            --key-pass env:BEDROCK_KEY_PASSWORD \
            --out "$ASSET" "$INPUT_APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$ASSET"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$ASSET" | grep -F com.bedrockenhanced.launcher
          echo "Signed APK ready: $ASSET"

      - name: Publish signed update to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BedrockEnhanced-Launcher-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
